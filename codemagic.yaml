workflows:
  android-debug:
    name: حساباتي Android debug
    instance_type: linux_x2
    max_build_duration: 120
    environment:
      java: 17
    triggering:
      events:
        - push
        - pull_request
      branch_patterns:
        - pattern: main
          include: true
          source: true
        - pattern: develop
          include: true
          source: true
      cancel_previous_builds: true
    scripts:
      - name: Install Python build dependencies
        script: |
          python3 -m pip install --upgrade pip
          python3 -m pip install "Cython<3" buildozer
      - name: Validate Python source
        script: |
          python3 -m py_compile main.py
      - name: Build debug APK with Buildozer
        script: |
          yes | buildozer -v android debug
    artifacts:
      - bin/*.apk
      - .buildozer/android/platform/python-for-android/**/*.log

  android-release:
    name: حساباتي Android release
    instance_type: linux_x2
    max_build_duration: 120
    environment:
      java: 17
      groups:
        - android_signing
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: v*
          include: true
    scripts:
      - name: Install Python build dependencies
        script: |
          python3 -m pip install --upgrade pip
          python3 -m pip install "Cython<3" buildozer
      - name: Build release APK
        script: |
          yes | buildozer -v android release
    artifacts:
      - bin/*.apk
      - bin/*.aab
