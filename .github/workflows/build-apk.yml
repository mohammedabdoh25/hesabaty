name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apk:
    name: Build debug APK (arm64-v8a + armeabi-v7a)
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            gcc \
            g++ \
            make \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            pkg-config \
            cmake \
            gettext \
            libffi-dev \
            libssl-dev \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev
          g++ --version
          java -version
          python --version

      - name: Install Python build tools
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "Cython<3" "buildozer==1.5.0"
          buildozer --version

      - name: Clean previous build outputs
        run: |
          rm -rf .buildozer bin
          echo "Cleaned .buildozer and bin directories"

      - name: Validate project files
        run: |
          test -f main.py
          test -f buildozer.spec
          python -m py_compile main.py
          echo "--- ABI settings in buildozer.spec ---"
          grep -E "^android\.(archs|ndk|ndk_api|api|minapi)" buildozer.spec || true

      - name: Build APK with Buildozer
        shell: bash
        run: |
          set -o pipefail
          buildozer -v android debug 2>&1 | tee buildozer.log

      - name: Verify APK contains both ABIs
        if: success()
        shell: bash
        run: |
          APK=$(ls bin/*.apk | head -n 1)
          echo "APK: $APK"
          echo "--- Native libraries inside APK ---"
          unzip -l "$APK" | grep "lib/" || true
          echo "--- Checking arm64-v8a ---"
          unzip -l "$APK" | grep -q "lib/arm64-v8a/" && echo "OK: arm64-v8a present" || (echo "MISSING: arm64-v8a" && exit 1)
          echo "--- Checking armeabi-v7a ---"
          unzip -l "$APK" | grep -q "lib/armeabi-v7a/" && echo "OK: armeabi-v7a present" || (echo "MISSING: armeabi-v7a" && exit 1)

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: hesabaty-debug-apk
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Buildozer log after failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: buildozer-log
          path: buildozer.log
          if-no-files-found: warn
          retention-days: 7
