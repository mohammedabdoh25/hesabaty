name: Build Android APK



on:

  workflow_dispatch:
  
  push:
  
    branches: [ main ]
    
  pull_request:
  
    branches: [ main ]
    


permissions:

  contents: read
  


jobs:

  build-apk:
  
    runs-on: ubuntu-22.04
    
    timeout-minutes: 120
    
    steps:
    
      - name: Checkout source
      
        uses: actions/checkout@v4
        
      - name: Set up Java 17
      
        uses: actions/setup-java@v4
        
        with:
        
          distribution: temurin
          
          java-version: '17'
          
      - name: Set up Python 3.11
      
        uses: actions/setup-python@v5
        
        with:
        
          python-version: '3.11'
          
          cache: pip
          
      - name: Install Android and Buildozer dependencies
      
        run: |
        
          sudo apt-get update
          
          sudo apt-get install -y build-essential gcc g++ make git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev automake gettext
          
          python -m pip install --upgrade pip
          
          python -m pip install "Cython<3" buildozer

      - name: Validate Python source
      
        run: python -m py_compile main.py
        
      - name: Build debug APK
      
        run: yes | buildozer -v android debug
        
      - name: Upload APK artifact
      
        uses: actions/upload-artifact@v4
        
        with:
        
          name: hesabaty-debug-apk
          
          path: bin/*.apk
          
          if-no-files-found: error
          
          retention-days: 14
          







































